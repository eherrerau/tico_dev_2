services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php-fpm
    networks:
      - tico-network

  php-fpm:
    build: .
    volumes:
      - .:/var/www/html
      - ./logs:/var/www/html/logs
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=tico_db
      - DB_USERNAME=tico_user
      - DB_PASSWORD=tico_password
    depends_on:
      - postgres
    networks:
      - tico-network

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=tico_db
      - POSTGRES_USER=tico_user
      - POSTGRES_PASSWORD=tico_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - tico-network

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - tico-network

volumes:
  postgres_data:

networks:
  tico-network:
    driver: bridge
