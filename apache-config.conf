# Apache configuration for TICO application

<VirtualHost *:80>
    ServerName tico.local
    DocumentRoot /path/to/tico_dev_2/public
    
    # Security Headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # PHP Configuration
    php_value session.cookie_httponly 1
    php_value session.cookie_secure 0
    php_value session.use_strict_mode 1
    php_value session.cookie_samesite "Lax"
    
    # Directory Configuration
    <Directory /path/to/tico_dev_2/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Disable server signature
        ServerSignature Off
        
        # Hide .htaccess files
        <Files ".ht*">
            Require all denied
        </Files>
        
        # Hide sensitive files
        <FilesMatch "\.(env|log|ini|conf)$">
            Require all denied
        </FilesMatch>
    </Directory>
    
    # Prevent access to source code and configuration
    <Directory /path/to/tico_dev_2/src>
        Require all denied
    </Directory>
    
    <Directory /path/to/tico_dev_2/config>
        Require all denied
    </Directory>
    
    <Directory /path/to/tico_dev_2/vendor>
        Require all denied
    </Directory>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/tico_error.log
    CustomLog ${APACHE_LOG_DIR}/tico_access.log combined
    LogLevel warn
</VirtualHost>

# HTTPS Configuration (Production)
<VirtualHost *:443>
    ServerName tico.local
    DocumentRoot /path/to/tico_dev_2/public
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /path/to/certificate.crt
    SSLCertificateKeyFile /path/to/private.key
    
    # Security Headers (HTTPS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # PHP Configuration (HTTPS)
    php_value session.cookie_httponly 1
    php_value session.cookie_secure 1
    php_value session.use_strict_mode 1
    php_value session.cookie_samesite "Lax"
    
    # Same directory and security configurations as HTTP
    <Directory /path/to/tico_dev_2/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        ServerSignature Off
        
        <Files ".ht*">
            Require all denied
        </Files>
        
        <FilesMatch "\.(env|log|ini|conf)$">
            Require all denied
        </FilesMatch>
    </Directory>
    
    <Directory /path/to/tico_dev_2/src>
        Require all denied
    </Directory>
    
    <Directory /path/to/tico_dev_2/config>
        Require all denied
    </Directory>
    
    <Directory /path/to/tico_dev_2/vendor>
        Require all denied
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/tico_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/tico_ssl_access.log combined
</VirtualHost>
